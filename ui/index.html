    <script>
      window.Prism = window.Prism || {};
      // Auto-highlight code blocks on page load
      document.addEventListener('DOMContentLoaded', function() {
        if (window.Prism && window.Prism.highlightAll) {
          window.Prism.highlightAll();
        }
      });
      // Also expose a global function for React components to use
      window.highlightCodeBlocks = function() {
        if (window.Prism && window.Prism.highlightAll) {
          window.Prism.highlightAll();
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#0d1117',

              // Ember accent scale (see src/theme.css for the full token set)
              brand: {

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      /* Theme tokens and base styles live in src/theme.css */

      /* Prism.js Base Styles */
      pre[class*="language-"],
      code[class*="language-"] {
        background: var(--color-surface-secondary);
        color: var(--color-text-primary);
        border-radius: 4px;
        padding: 1rem;
        overflow-x: auto;
        font-family: var(--font-mono);
        font-size: 0.9rem;
        line-height: 1.6;
        tab-size: 2;
      }

      /* YAML Syntax Highlighting */
      pre[class*="language-yaml"],
      code[class*="language-yaml"],
      pre code[class*="yaml"],
      .codeBlockLines,
      .codeBlockLines_e6Vv {
        font-family: var(--font-mono);
      }

      /* Prism.js Token Styles - Base */
      .token.comment,
      .token.prolog,
      .token.doctype,
      .token.cdata {
        color: #7a746b;
        font-style: italic;
      }

      .token.punctuation {
        color: #9a948a;
      }

      /* YAML Key-Value pairs */
      .token.keyword,
      code .token.keyword,
      pre .token.keyword {
        color: #f0956a;
        font-weight: 500;
      }

      /* YAML keys (property names) - these are typically 'property' tokens in YAML */
      .token.property,
      .token.attr-name,
      code .token.attr-name,
      pre .token.attr-name,
      code .token.property,
      pre .token.property,
      code span[data-yaml-key],
      pre span[data-yaml-key] {
        color: #e6c879;
        font-weight: 500;
      }

      /* YAML strings (values) */
      .token.string,
      code .token.string,
      pre .token.string,
      code span[data-yaml-string],
      pre span[data-yaml-string] {
        color: #93d1a8;
      }

      /* YAML numbers */
      .token.number,
      code .token.number,
      pre .token.number,
      code span[data-yaml-number],
      pre span[data-yaml-number] {
        color: #f0a57d;
      }

      /* YAML booleans */
      .token.boolean,
      code .token.boolean,
      pre .token.boolean,
      code span[data-yaml-boolean],
      pre span[data-yaml-boolean] {
        color: #f0928a;
      }

      /* YAML null values */
      .token.null,
      code .token.null,
      pre .token.null,
      code span[data-yaml-null],
      pre span[data-yaml-null] {
        color: #f0928a;
        font-style: italic;
      }

      /* YAML comments */
      .token.comment,
      code .token.comment,
      pre .token.comment,
      code span[data-yaml-comment],
      pre span[data-yaml-comment] {
        color: #7a746b;
        font-style: italic;
      }

      /* YAML punctuation (colons, dashes, etc.) */
      .token.punctuation,
      code .token.punctuation,
      pre .token.punctuation {
        color: #9a948a;
      }

      /* YAML operators */
      .token.operator,
      code .token.operator,
      pre .token.operator {
        color: #9a948a;
      }

      /* YAML document separators (---, ...) */
      code span:contains("---"),
      pre span:contains("---"),
      code span:contains("..."),
      pre span:contains("...") {
        color: #7a746b;
        font-weight: 600;
      }

      /* General code block styling with YAML support - already defined above */

      /* YAML-specific highlighting patterns using attribute selectors */
      code[data-language="yaml"] .yaml-key,
      pre[data-language="yaml"] .yaml-key {
        color: #e6c879;
        font-weight: 500;
      }

      code[data-language="yaml"] .yaml-string,
      pre[data-language="yaml"] .yaml-string {
        color: #93d1a8;
      }

      code[data-language="yaml"] .yaml-number,
      pre[data-language="yaml"] .yaml-number {
        color: #f0a57d;
      }

      code[data-language="yaml"] .yaml-comment,
      pre[data-language="yaml"] .yaml-comment {
        color: #7a746b;
        font-style: italic;
      }

      /* Light theme adjustments for YAML */
      :root[data-theme='light'] .token.keyword,
      :root[data-theme='light'] code .token.keyword,
      :root[data-theme='light'] pre .token.keyword {
        color: #b4521f;
      }

      :root[data-theme='light'] .token.attr-name,
      :root[data-theme='light'] code .token.attr-name,
      :root[data-theme='light'] pre .token.attr-name {
        color: #8a6a12;
      }

      :root[data-theme='light'] .token.string,
      :root[data-theme='light'] code .token.string,
      :root[data-theme='light'] pre .token.string {
        color: #2f7a4a;
      }

      :root[data-theme='light'] .token.number,
      :root[data-theme='light'] code .token.number,
      :root[data-theme='light'] pre .token.number {
        color: #c8602f;
      }

      :root[data-theme='light'] .token.boolean,
      :root[data-theme='light'] code .token.boolean,
      :root[data-theme='light'] pre .token.boolean {
        color: #b3362b;
      }

      :root[data-theme='light'] .token.comment,
      :root[data-theme='light'] code .token.comment,
      :root[data-theme='light'] pre .token.comment {
        color: #757575;
      }

      :root[data-theme='light'] .token.punctuation,
      :root[data-theme='light'] code .token.punctuation,
      :root[data-theme='light'] pre .token.punctuation {
        color: #6b665e;
      }

      /* Generic code block line styling */
      .codeBlockLines,
      .codeBlockLines_e6Vv,
      pre code,
      code {
        display: block;
        line-height: 1.6;
        tab-size: 2;
      }

      /* Inline code styling */
      :not(pre) > code {
        padding: 0.125rem 0.25rem;
        background: var(--color-surface-muted);
        border-radius: 3px;
        font-size: 0.9em;
      }
    </style>
