<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spectre — Approach B · Warm Ink</title>
<script src="common.js"></script>
<style>
  /* Approach B — "Warm Ink": labeled sidebar, inset rounded canvas, soft surfaces, one ember accent. */
  :root {
    --bg: #151412;
    --canvas: #1c1b19;
    --surface: #23221f;
    --surface-2: #2a2926;
    --border: #2c2a27;
    --border-strong: #393733;
    --text: #ece8e1;
    --text-2: #aba59b;
    --text-3: #7a746b;
    --accent: #e07a47;
    --accent-strong: #f0956a;
    --accent-soft: rgba(224, 122, 71, 0.14);
    --ok: #6dbb88;
    --warn: #d8b150;
    --err: #e2574c;
    --mono: 'DejaVu Sans Mono', ui-monospace, monospace;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -8px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13.5px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; overflow: hidden; }

  /* ---------- Sidebar ---------- */
  .side { width: 236px; flex: none; display: flex; flex-direction: column; padding: 14px 10px 12px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 0; height: 34px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(155deg, #f4a77b 0%, #e07a47 50%, #b9532a 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
  .brand b { font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; }
  .brand .collapse { margin-left: auto; color: var(--text-3); display: grid; }
  .cluster { margin: 14px 0 18px; height: 34px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); color: var(--text); font-size: 13px; }
  .cluster i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .cluster span { color: var(--text-3); font-size: 12px; margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--text-2); text-decoration: none; margin-bottom: 2px; }
  .nav a svg { color: var(--text-3); }
  .nav a.on { background: var(--surface-2); color: var(--text); }
  .nav a.on svg { color: var(--accent); }
  .nav a .k { margin-left: auto; font: 11px var(--mono); color: var(--text-3); }
  .side h6 { font-size: 11.5px; font-weight: 500; color: var(--text-3); padding: 20px 10px 6px; }
  .recent a { display: flex; flex-direction: column; padding: 6px 10px; border-radius: 8px; text-decoration: none; }
  .recent a b { font-weight: 400; color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
  .recent a b i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .recent a span { color: var(--text-3); font-size: 11.5px; padding-left: 14px; }
  .side .grow { flex: 1; }
  .side .foot { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 0; color: var(--text-3); font-size: 11.5px; }

  /* ---------- Canvas ---------- */
  .canvas { flex: 1; min-width: 0; margin: 8px 8px 8px 0; background: var(--canvas); border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .head { display: flex; align-items: center; gap: 12px; padding: 18px 24px 0; }
  .head h1 { font-size: 18px; font-weight: 600; letter-spacing: -.015em; }
  .head .desc { color: var(--text-3); font-size: 13px; margin-left: 4px; }
  .head .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn { height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; background: var(--surface); color: var(--text); font-size: 13px; white-space: nowrap; }
  .btn svg { color: var(--text-3); }
  .btn.ghost { background: transparent; color: var(--text-2); }
  .btn.icon { width: 32px; padding: 0; justify-content: center; }
  .btn.primary { background: var(--accent); color: #1a0f08; font-weight: 600; }
  .btn.primary svg { color: #1a0f08; }
  .live { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); padding: 0 6px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .filters { display: flex; align-items: center; gap: 6px; padding: 14px 24px 16px; border-bottom: 1px solid var(--border); }
  .chip { height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; border-radius: 8px; background: var(--surface); font-size: 12.5px; color: var(--text); white-space: nowrap; }
  .chip .k { color: var(--text-3); }
  .chip svg { color: var(--text-3); }
  .chip.on { background: var(--accent-soft); color: var(--accent-strong); }
  .chip.on svg { color: var(--accent-strong); }
  .chip.add { background: transparent; color: var(--text-3); }
  .search { margin-left: auto; width: 240px; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); color: var(--text-3); font-size: 12.5px; }
  .search .kbd { margin-left: auto; font: 11px var(--mono); border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 5px; }

  /* ---------- Timeline ---------- */
  .tl { flex: 1; position: relative; overflow: hidden; }
  .axis { display: grid; grid-template-columns: 320px 1fr; height: 40px; }
  .axis .l { padding: 0 24px; display: flex; align-items: center; color: var(--text-3); font-size: 12px; gap: 6px; }
  .axis .t { position: relative; margin-right: 32px; }
  .axis .t span { position: absolute; top: 13px; transform: translateX(-50%); font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .row { display: grid; grid-template-columns: 320px 1fr; height: 46px; }
  .row .l { padding: 0 24px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .row .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .mt { font-size: 11.5px; color: var(--text-3); line-height: 1.3; }
  .row.sel { background: var(--surface); }
  .row.sel .l { box-shadow: inset 2px 0 0 var(--accent); }
  .track { position: relative; margin-right: 32px; }
  .bar { position: absolute; top: 13px; height: 20px; border-radius: 6px; }
  .bar.ok { background: rgba(109,187,136,.30); box-shadow: inset 0 0 0 1px rgba(109,187,136,.5); }
  .bar.warn { background: rgba(216,177,80,.28); box-shadow: inset 0 0 0 1px rgba(216,177,80,.5); }
  .bar.err { background: rgba(226,87,76,.32); box-shadow: inset 0 0 0 1px rgba(226,87,76,.55); }
  .bar::before { content: ''; position: absolute; left: 6px; top: 7px; width: 6px; height: 6px; border-radius: 50%; }
  .bar.ok::before { background: var(--ok); } .bar.warn::before { background: var(--warn); } .bar.err::before { background: var(--err); }
  .bar.short::before { display: none; }
  .ev { position: absolute; top: 18px; width: 2px; height: 10px; margin-left: -1px; border-radius: 1px; background: var(--text); opacity: .85; }
  .burst { position: absolute; top: 13px; height: 20px; border-radius: 6px; background: repeating-linear-gradient(90deg, rgba(226,87,76,.5) 0 2px, rgba(226,87,76,.18) 2px 5px); box-shadow: inset 0 0 0 1px rgba(226,87,76,.45); display: flex; align-items: center; justify-content: center; }
  .burst span { background: var(--canvas); color: #f0928a; font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 4px; line-height: 16px; }
  .tl.open .track, .tl.open .axis .t { margin-right: 456px; }
  .gl { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.035); }
  .now { position: absolute; top: 40px; bottom: 0; width: 2px; background: var(--accent); opacity: .7; }

  /* ---------- Floating sheet ---------- */
  .sheet { position: absolute; right: 12px; top: 12px; bottom: 12px; width: 420px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .sh-head { padding: 18px 20px 14px; }
  .sh-top { display: flex; align-items: center; gap: 8px; }
  .kind { font-size: 11.5px; color: var(--text-2); background: var(--surface-2); border-radius: 6px; padding: 2px 8px; }
  .sh-top .acts { margin-left: auto; display: flex; gap: 2px; color: var(--text-3); }
  .sh-top .acts span { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; }
  .sh-name { font-size: 18px; font-weight: 600; letter-spacing: -.015em; margin-top: 12px; }
  .sh-sub { color: var(--text-3); font-size: 12.5px; display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .seg { display: flex; gap: 2px; padding: 3px; background: var(--canvas); border-radius: 9px; margin: 0 20px; }
  .seg span { flex: 1; text-align: center; height: 28px; line-height: 28px; border-radius: 6px; color: var(--text-3); font-size: 12.5px; }
  .seg span.on { background: var(--surface-2); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .sh-body { padding: 8px 20px 20px; overflow: hidden; }
  .blk { margin-top: 18px; }
  .blk h5 { font-size: 12px; font-weight: 500; color: var(--text-3); margin-bottom: 10px; display: flex; }
  .blk h5 span { margin-left: auto; font-weight: 400; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fact { background: var(--canvas); border-radius: 8px; padding: 9px 12px; }
  .fact small { display: block; font-size: 11.5px; color: var(--text-3); }
  .fact b { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .fact b.link { color: var(--accent-strong); }
  .evl { position: relative; padding-left: 18px; }
  .evl::before { content: ''; position: absolute; left: 3px; top: 8px; bottom: 8px; width: 1px; background: var(--border-strong); }
  .evi { position: relative; padding: 0 0 12px; }
  .evi::before { content: ''; position: absolute; left: -18px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); box-shadow: 0 0 0 3px var(--surface); }
  .evi.w::before { background: var(--warn); }
  .evi .t { font-size: 11.5px; color: var(--text-3); }
  .evi .r { font-weight: 500; font-size: 13px; margin-left: 6px; }
  .evi .m { color: var(--text-2); font-size: 12.5px; }
  .diff { font: 11.5px/1.7 var(--mono); background: var(--canvas); border-radius: 8px; padding: 8px 0; }
  .diff div { padding: 0 12px; white-space: pre; color: var(--text-2); }
  .diff .add { background: rgba(109,187,136,.1); color: #9fd6b1; }
  .diff .del { background: rgba(226,87,76,.1); color: #f0a49d; }

  /* ---------- Graph ---------- */
  .gwrap { flex: 1; position: relative; overflow: hidden; }
  .gwrap svg.g { position: absolute; left: 0; top: 0; bottom: 0; right: 420px; height: 100%; width: calc(100% - 420px); }
  .zoom { position: absolute; left: 24px; bottom: 20px; display: flex; align-items: center; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
  .zoom span { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--text-2); }
  .zoom em { font-style: normal; font-size: 12px; color: var(--text-3); padding: 0 6px; font-variant-numeric: tabular-nums; }
  .stats { position: absolute; left: 220px; bottom: 20px; display: flex; gap: 16px; height: 38px; align-items: center; color: var(--text-3); font-size: 12.5px; }
  .stats b { color: var(--text-2); font-weight: 500; }
  .stats .e b { color: var(--err); }
  .pcard { padding: 14px 16px; border-radius: 10px; background: var(--canvas); margin-bottom: 8px; border: 1px solid transparent; }
  .pcard.on { border-color: rgba(224,122,71,.45); background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft)), var(--canvas); }
  .pcard .ln { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); }
  .pcard .rk { width: 20px; height: 20px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
  .pcard.on .rk { background: var(--accent); color: #1a0f08; }
  .pcard .sv { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  .pcard .sv i { width: 6px; height: 6px; border-radius: 50%; }
  .pcard .root { font-weight: 500; margin: 8px 0 4px; }
  .pcard .meta { font-size: 12px; color: var(--text-3); }
  .pcard .sum { font-size: 12.5px; color: var(--text-2); margin-top: 10px; line-height: 1.6; }
  .steps { display: flex; flex-direction: column; gap: 0; margin-top: 12px; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 12.5px; height: 26px; position: relative; }
  .step i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid; flex: none; background: var(--canvas); z-index: 1; }
  .step + .step::before { content: ''; position: absolute; left: 4px; top: -9px; height: 18px; width: 1px; background: var(--border-strong); }
  .step em { font-style: normal; color: var(--text-3); margin-left: auto; font-size: 11.5px; }

  /* ---------- Settings ---------- */
  .s-scroll { flex: 1; overflow: hidden; padding: 8px 24px 32px; }
  .s-col { max-width: 720px; margin: 0 auto; }
  .s-col h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin-top: 28px; }
  .s-col > p { color: var(--text-3); margin: 4px 0 8px; }
  .s-col h3 { font-size: 13px; font-weight: 500; color: var(--text-2); margin: 28px 0 10px 2px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .crow { display: flex; align-items: center; gap: 20px; padding: 16px 18px; }
  .crow + .crow { border-top: 1px solid var(--border); }
  .crow .l { flex: 1; }
  .crow .l b { display: block; font-weight: 500; font-size: 13.5px; }
  .crow .l span { color: var(--text-3); font-size: 12.5px; }
  .tg { width: 34px; height: 20px; border-radius: 10px; background: var(--border-strong); position: relative; flex: none; }
  .tg::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #d8d3cb; }
  .tg.on { background: var(--accent); } .tg.on::after { left: 16px; background: #fff; }
  .sw { display: flex; gap: 2px; padding: 3px; background: var(--canvas); border-radius: 9px; }
  .sw span { padding: 0 12px; height: 28px; display: flex; align-items: center; gap: 6px; border-radius: 6px; color: var(--text-3); font-size: 12.5px; }
  .sw span.on { background: var(--surface-2); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .kinds { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 16px; }
  .kc { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 7px; background: var(--canvas); color: var(--text-3); font-size: 12.5px; }
  .kc.on { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }
  .kc.on svg { color: var(--accent); }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px 18px; }
  .fld label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; }
  .fld label em { font-style: normal; color: var(--text-3); }
  .inp { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; background: var(--canvas); border: 1px solid var(--border); font-size: 13px; }
  .inp.ph { color: var(--text-3); }
  .inp svg { color: var(--text-3); }
  .drop { margin: 0 18px 18px; border: 1px dashed var(--border-strong); border-radius: 10px; padding: 18px; display: flex; align-items: center; gap: 14px; color: var(--text-3); font-size: 12.5px; }
  .drop .ic { width: 36px; height: 36px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-2); }
  .drop b { display: block; color: var(--text); font-weight: 500; font-size: 13px; }
  .drop .btn { margin-left: auto; }
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><div class="logo"></div><b>Spectre</b><span class="collapse"></span></div>
  <div class="cluster"><i></i>prod-eu-1<span id="clus"></span></div>
  <nav class="nav">
    <a data-v="timeline"><span></span>Timeline<span class="k">G T</span></a>
    <a data-v="graph"><span></span>Graph<span class="k">G G</span></a>
  </nav>
  <h6>Recently viewed</h6>
  <div class="recent">
    <a><b><i style="background:var(--ok)"></i>external-secrets</b><span>Deployment · external-secrets</span></a>
    <a><b><i style="background:var(--err)"></i>n8n</b><span>HelmRelease · n8n</span></a>
    <a><b><i style="background:var(--err)"></i>cert-manager-crds</b><span>Kustomization · cert-manager</span></a>
  </div>
  <div class="grow"></div>
  <nav class="nav"><a data-v="settings"><span></span>Settings</a></nav>
  <div class="foot"><span>v0.9.2</span><span>Synced 4s ago</span></div>
</aside>
<section class="canvas" id="main"></section>

<script>
const view = currentView();
document.querySelector('.logo').innerHTML = ghostSvg(16);
document.querySelector('.collapse').innerHTML = icon('panel', 16);
document.getElementById('clus').innerHTML = icon('chevron', 13);
document.querySelectorAll('.nav a').forEach(a => {
  a.querySelector('span').outerHTML = icon(a.dataset.v, 16);
  if (a.dataset.v === view) a.classList.add('on');
});
const pct = m => (m / TL_SPAN) * 100;
const sc = s => ({ ok: 'var(--ok)', warn: 'var(--warn)', err: 'var(--err)' }[s]);

function timelineView() {
  const grid = TL_TICKS.map(t => `<div class="gl" style="left:${pct(t)}%"></div>`).join('');
  const rows = TIMELINE_ROWS.map(r => {
    let bars = r.segs.map(([a, b, s]) => `<div class="bar ${s} ${b - a < 3 ? 'short' : ''}" style="left:calc(${pct(a)}% + ${a ? 2 : 0}px);width:calc(${pct(b - a)}% - ${a ? 2 : 0}px)"></div>`).join('');
    if (r.burst) bars += `<div class="burst" style="left:${pct(r.burst.from)}%;width:${pct(r.burst.to - r.burst.from)}%"><span>${r.burst.count} restarts</span></div>`;
    const evs = (r.events || []).map(e => `<div class="ev" style="left:${pct(e)}%"></div>`).join('');
    return `<div class="row ${r.selected ? 'sel' : ''}"><div class="l"><span class="nm">${r.name}</span><span class="mt">${r.kind} · ${r.ns}</span></div><div class="track">${grid}${bars}${evs}</div></div>`;
  }).join('');

  const d = DETAIL;
  const sheet = `<div class="sheet">
    <div class="sh-head">
      <div class="sh-top"><span class="kind">${d.kind}</span><span class="acts"><span>${icon('copy', 15)}</span><span>${icon('external', 15)}</span><span>${icon('x', 16)}</span></span></div>
      <div class="sh-name">${d.name}</div>
      <div class="sh-sub">${d.ns} <span>·</span> <span class="status"><i></i>Ready</span> <span>· since 06:43</span></div>
    </div>
    <div class="seg"><span class="on">Overview</span><span>Events</span><span>Changes</span><span>YAML</span></div>
    <div class="sh-body">
      <div class="blk"><div class="facts">${d.meta.map(([k, v]) => `<div class="fact"><small>${k}</small><b class="${k === 'Owner' ? 'link' : ''}">${v}</b></div>`).join('')}</div></div>
      <div class="blk"><h5>Events <span>14 total</span></h5><div class="evl">
        ${d.events.slice(0, 3).map(e => `<div class="evi ${e.type === 'Warning' ? 'w' : ''}"><span class="t">${e.t}</span><span class="r">${e.reason}</span><div class="m">${e.msg}</div></div>`).join('')}
      </div></div>
      <div class="blk"><h5>Latest change <span>06:36:24 · revision 14</span></h5>
        <div class="diff">${d.diff.slice(5).map(([s, l]) => `<div class="${s === '+' ? 'add' : s === '-' ? 'del' : ''}">${s} ${l.trim()}</div>`).join('')}</div></div>
    </div>
  </div>`;

  return `<div class="head"><h1>Timeline</h1><span class="desc">16 resources · 247 events</span>
      <div class="r"><span class="live"><i></i>Live</span><span class="btn">${icon('clock', 15)}Last 1 hour${icon('chevron', 14)}</span><span class="btn icon">${icon('refresh', 15)}</span></div></div>
    <div class="filters">
      <span class="chip"><span class="k">Namespace</span>4 selected${icon('chevron', 13)}</span>
      <span class="chip"><span class="k">Kind</span>Pod, Deployment +5${icon('chevron', 13)}</span>
      <span class="chip on">${icon('check', 13, 2.2)}Problematic only</span>
      <span class="chip add">${icon('plus', 13)}Filter</span>
      <span class="search">${icon('search', 14)}Search resources<span class="kbd">/</span></span>
    </div>
    <div class="tl open">
      <div class="axis"><div class="l">Resource</div><div class="t">${TL_TICKS.map(t => `<span style="left:${pct(t)}%">${tlLabel(t)}</span>`).join('')}</div></div>
      ${rows}
      ${sheet}
    </div>`;
}

function graphView() {
  const W = 1060, H = 680;
  const byId = Object.fromEntries(GRAPH_NODES.map(n => [n.id, n]));
  const trunc = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;
  const R = 15;
  const edges = GRAPH_EDGES.map(([a, b, p]) => {
    const A = byId[a], B = byId[b];
    const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy);
    const x1 = A.x + dx / len * (R + 3), y1 = A.y + dy / len * (R + 3), x2 = B.x - dx / len * (R + (p ? 7 : 3)), y2 = B.y - dy / len * (R + (p ? 7 : 3));
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${p ? 'var(--accent)' : '#34322e'}" stroke-width="${p ? 2 : 1}" ${p ? 'marker-end="url(#arr)"' : ''}/>`;
  }).join('');
  const nodes = GRAPH_NODES.map(n => {
    const dim = !n.path, c = sc(n.status);
    return `<g transform="translate(${n.x},${n.y})" opacity="${dim ? .55 : 1}">
      ${n.id === 'hr' ? `<circle r="${R + 8}" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity=".6"/><circle r="${R + 14}" fill="var(--accent)" opacity=".08"/>` : ''}
      <circle r="${R}" fill="${dim ? '#232220' : c}" fill-opacity="${dim ? 1 : .22}" stroke="${c}" stroke-width="${dim ? 1.25 : 2}"/>
      <circle r="4" fill="${c}"/>
      ${n.badge ? `<g transform="translate(${R - 2},${-R + 2})"><rect x="-2" y="-8" width="${n.badge.length * 6 + 10}" height="16" rx="8" fill="${c}" stroke="var(--canvas)" stroke-width="2"/><text x="${n.badge.length * 3 + 3}" y="3.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1c1b19" font-family="Inter">${n.badge}</text></g>` : ''}
      <text y="${R + 17}" text-anchor="middle" font-size="10" fill="#7a746b" font-family="Inter">${n.kind}</text>
      <text y="${R + 31}" text-anchor="middle" font-size="11.5" font-weight="500" fill="${dim ? '#aba59b' : '#ece8e1'}" font-family="Inter">${trunc(n.name, 26)}</text>
    </g>`;
  }).join('');
  const svg = `<svg class="g" viewBox="-20 20 ${W + 40} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--accent)"/></marker></defs>${edges}${nodes}</svg>`;

  const p = CAUSAL_PATHS;
  const card = (x, on) => `<div class="pcard ${on ? 'on' : ''}">
    <div class="ln"><span class="rk">${x.rank}</span>${x.confidence}% confidence<span class="sv"><i style="background:${x.severity === 'critical' ? 'var(--err)' : 'var(--warn)'}"></i>${x.severity}</span></div>
    <div class="root">${x.root}</div><div class="meta">${x.steps} steps · ${x.tags.join(', ')}</div>
    ${on ? `<div class="sum">${x.summary}</div><div class="steps">
      ${[['HelmRelease', 'external-secrets', 'err', 'ReconcileFailed'], ['Deployment', 'external-secrets', 'warn', 'owns'], ['ReplicaSet', 'external-secrets-68cfff45c5', 'warn', 'owns'], ['Pod', 'external-secrets-…-7s2t4', 'err', 'CrashLoopBackOff']]
        .map(([k, n, s, why]) => `<div class="step"><i style="border-color:${sc(s)}"></i><span style="color:var(--text-3)">${k}</span>${n}<em>${why}</em></div>`).join('')}
    </div>` : ''}</div>`;
  const sheet = `<div class="sheet">
    <div class="sh-head"><div class="sh-top"><span style="font-size:15px;font-weight:600">Causal paths</span><span class="kind" style="margin-left:4px">3</span><span class="acts"><span>${icon('more', 16)}</span><span>${icon('x', 16)}</span></span></div>
      <div class="sh-sub" style="margin-top:4px">Ranked root-cause candidates for this snapshot</div></div>
    <div class="sh-body" style="padding-top:0">${card(p[0], true)}${card(p[1])}${card(p[2])}</div>
  </div>`;

  return `<div class="head"><h1>Graph</h1><span class="desc">external-secrets · snapshot 06:50</span>
      <div class="r"><span class="btn">${icon('clock', 15)}now − 16h${icon('chevron', 14)}</span><span class="btn"><span style="color:var(--text-3)">Lookback</span>6 hours${icon('chevron', 14)}</span></div></div>
    <div class="filters">
      <span class="chip"><span class="k">Namespace</span>external-secrets${icon('chevron', 13)}</span>
      <span class="chip"><span class="k">Kind</span>Pod, Deployment, ReplicaSet${icon('chevron', 13)}</span>
      <span class="chip add">${icon('plus', 13)}Filter</span>
      <span class="search">${icon('search', 14)}Find in graph<span class="kbd">/</span></span>
    </div>
    <div class="gwrap">${svg}
      <div class="zoom"><span>${icon('minus', 15)}</span><em>100%</em><span>${icon('plus', 15)}</span><span>${icon('maximize', 14)}</span></div>
      <div class="stats"><span><b>24</b> resources</span><span><b>47</b> relationships</span><span class="e"><b>150</b> anomalies</span></div>
      ${sheet}
    </div>`;
}

function settingsView() {
  return `<div class="s-scroll"><div class="s-col">
    <h1>Settings</h1><p>Preferences are stored in this browser.</p>
    <h3>Appearance</h3>
    <div class="card">
      <div class="crow"><div class="l"><b>Theme</b><span>Dark is the default; light is available for bright rooms.</span></div>
        <div class="sw"><span class="on">${icon('moon', 13)}Dark</span><span>${icon('sun', 13)}Light</span><span>${icon('monitor', 13)}System</span></div></div>
      <div class="crow"><div class="l"><b>Compact rows</b><span>Reduce row height on the timeline for dense overviews.</span></div><div class="tg"></div></div>
      <div class="crow"><div class="l"><b>Time format</b><span>Example: 14:30:00</span></div><div class="sw"><span class="on">24-hour</span><span>12-hour</span></div></div>
    </div>
    <h3>Default filters</h3>
    <div class="card">
      <div class="crow"><div class="l"><b>Resource kinds</b><span>Shown by default in Timeline and Graph. Changing this resets current filters.</span></div><span class="btn ghost">Reset</span></div>
      <div class="kinds">${RESOURCE_KINDS.map(k => DEFAULT_KINDS.includes(k) ? `<span class="kc on">${icon('check', 12, 2.4)}${k}</span>` : `<span class="kc">${k}</span>`).join('')}</div>
      <div class="crow"><div class="l"><b>Hide inactive ReplicaSets</b><span>Hide ReplicaSets with spec.replicas = 0 in the Graph view.</span></div><div class="tg on"></div></div>
    </div>
    <h3>Data</h3>
    <div class="card">
      <div class="crow"><div class="l"><b>Export</b><span>Download timeline data for offline analysis or backup.</span></div><span class="btn primary">${icon('download', 14, 2)}Download</span></div>
      <div class="form" style="padding-top:0">
        <div class="fld"><label>From</label><div class="inp">${icon('calendar', 14)}1d ago</div></div>
        <div class="fld"><label>Until</label><div class="inp">${icon('calendar', 14)}now</div></div>
        <div class="fld"><label>Cluster ID <em>optional</em></label><div class="inp ph">e.g. production</div></div>
        <div class="fld"><label>Instance ID <em>optional</em></label><div class="inp ph">e.g. instance-1</div></div>
      </div>
    </div>
  </div></div>`;
}

document.getElementById('main').innerHTML = view === 'graph' ? graphView() : view === 'settings' ? settingsView() : timelineView();
</script>
</body>
</html>
