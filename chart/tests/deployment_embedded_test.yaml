suite: test embedded deployment
templates:
  - deployment.yaml
tests:
  - it: should configure an embedded data volume and no falkordb sidecar
    set:
      embedded:
        dataDir: /var/lib/spectre-data
        persistence:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--data-dir=/var/lib/spectre-data"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: embedded-data
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /var/lib/spectre-data
      - equal:
          path: spec.template.spec.volumes[1].name
          value: embedded-data
      - equal:
          path: spec.template.spec.volumes[1].persistentVolumeClaim.claimName
          value: RELEASE-NAME-spectre-embedded
      - isNull:
          path: spec.template.spec.containers[1]
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--graph-enabled=true"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--integrations-config=/var/lib/spectre/config/integrations.yaml"

  - it: should fall back to emptyDir when embedded persistence is disabled
    set:
      embedded:
        dataDir: /var/lib/spectre-data
        persistence:
          enabled: false
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].name
          value: embedded-data
      - isNotNull:
          path: spec.template.spec.volumes[1].emptyDir

  - it: should use Recreate for single-replica embedded persistent deployments with the default strategy
    set:
      embedded:
        persistence:
          enabled: true
      replicaCount: 1
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
          value: OnRootMismatch

  - it: should keep an explicit embedded rolling update override
    set:
      embedded:
        persistence:
          enabled: true
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 0
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 0

  - it: should not append integration or backend-selection args
    set:
      embedded:
        dataDir: /var/lib/spectre-data
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--data-dir=/var/lib/spectre-data"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--embedded"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--integrations-config=/var/lib/spectre/config/integrations.yaml"

  - it: should pass embedded checkpoint interval when configured
    set:
      embedded:
        dataDir: /var/lib/spectre-data
        checkpointInterval: 15m
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded-checkpoint-interval=15m"

  - it: should pass embedded checkpoint tail event budget when embedded mode is enabled
    set:
      embedded:
        dataDir: /var/lib/spectre-data
        checkpointMaxTailEvents: 2048
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded-checkpoint-max-tail-events=2048"

  - it: should pass embedded checkpoint retention count when embedded mode is enabled
    set:
      embedded:
        dataDir: /var/lib/spectre-data
        checkpointRetentionCount: 3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded-checkpoint-retention-count=3"

  - it: should pass embedded checkpoint tail byte budget when embedded mode is enabled
    set:
      embedded:
        dataDir: /var/lib/spectre-data
        checkpointMaxTailBytes: 16777216
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded-checkpoint-max-tail-bytes=16777216"

  - it: should pass embedded checkpoint shutdown behavior when embedded mode is enabled
    set:
      embedded:
        dataDir: /var/lib/spectre-data
        checkpointOnShutdown: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded-checkpoint-on-shutdown=false"

  - it: should pass embedded flush and segment tuning when configured
    set:
      embedded:
        dataDir: /var/lib/spectre-data
        flushInterval: 2m
        segmentTargetBytes: 33554432
        compactionMinSegments: 8
        autoCompaction: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded-flush-interval=2m"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded-segment-target-bytes=33554432"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded-compaction-min-segments=8"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded-auto-compaction=false"

  - it: should pass embedded retention days when configured
    set:
      embedded:
        dataDir: /var/lib/spectre-data
        retentionDays: 14
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded-retention-days=14"
