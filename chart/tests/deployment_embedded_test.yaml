suite: test embedded deployment
templates:
  - deployment.yaml
tests:
  - it: should configure embedded mode with a dedicated data volume and no falkordb sidecar
    set:
      embedded:
        enabled: true
        dataDir: /var/lib/spectre-data
        persistence:
          enabled: true
      graph:
        enabled: true
        falkordb:
          sidecar: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--data-dir=/var/lib/spectre-data"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].name
          value: embedded-data
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].mountPath
          value: /var/lib/spectre-data
      - equal:
          path: spec.template.spec.volumes[2].name
          value: embedded-data
      - equal:
          path: spec.template.spec.volumes[2].persistentVolumeClaim.claimName
          value: RELEASE-NAME-spectre-embedded
      - isNull:
          path: spec.template.spec.containers[1]

  - it: should fall back to emptyDir when embedded persistence is disabled
    set:
      embedded:
        enabled: true
        dataDir: /var/lib/spectre-data
        persistence:
          enabled: false
    asserts:
      - equal:
          path: spec.template.spec.volumes[2].name
          value: embedded-data
      - isNotNull:
          path: spec.template.spec.volumes[2].emptyDir

  - it: should use Recreate for single-replica embedded persistent deployments with the default strategy
    set:
      embedded:
        enabled: true
        persistence:
          enabled: true
      replicaCount: 1
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should keep an explicit embedded rolling update override
    set:
      embedded:
        enabled: true
        persistence:
          enabled: true
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 0
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 0

  - it: should not append an integrations data-dir override in embedded mode
    set:
      embedded:
        enabled: true
        dataDir: /var/lib/spectre-data
      graph:
        enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--data-dir=/var/lib/spectre-data"
      - equal:
          path: spec.template.spec.containers[0].args[9]
          value: "--integrations-config=/var/lib/spectre/config/integrations.yaml"
      - isNull:
          path: spec.template.spec.containers[0].args[10]

  - it: should pass embedded checkpoint interval when configured
    set:
      embedded:
        enabled: true
        dataDir: /var/lib/spectre-data
        checkpointInterval: 15m
      graph:
        enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded-checkpoint-interval=15m"

  - it: should pass embedded checkpoint tail event budget when embedded mode is enabled
    set:
      embedded:
        enabled: true
        dataDir: /var/lib/spectre-data
        checkpointMaxTailEvents: 2048
      graph:
        enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--embedded-checkpoint-max-tail-events=2048"
