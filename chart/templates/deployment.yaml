apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spectre.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "spectre.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- $useEmbeddedRecreate := and .Values.embedded.persistence.enabled (eq (int .Values.replicaCount) 1) (eq .Values.updateStrategy.type "RollingUpdate") (eq (int .Values.updateStrategy.rollingUpdate.maxUnavailable) 0) (eq (int .Values.updateStrategy.rollingUpdate.maxSurge) 1) }}
  {{- if $useEmbeddedRecreate }}
  strategy:
    type: Recreate
  {{- else }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- if .Values.minReadySeconds }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  {{- end }}
  {{- if .Values.revisionHistoryLimit }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "spectre.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spectre.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "spectre.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.dnsPolicy }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: {{ .Values.hostNetwork }}
      {{- end }}
      {{- if .Values.hostPID }}
      hostPID: {{ .Values.hostPID }}
      {{- end }}
      {{- if .Values.hostIPC }}
      hostIPC: {{ .Values.hostIPC }}
      {{- end }}
      containers:
      - name: spectre
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        {{- if .Values.pprof.enabled }}
        - name: pprof
          containerPort: {{ .Values.pprof.port }}
          protocol: TCP
        {{- end }}
        args:
        - --api-port={{ .Values.service.targetPort }}
        {{- if .Values.config.logLevels }}
          {{- range $package, $level := .Values.config.logLevels }}
        - --log-level={{ $package }}={{ $level }}
          {{- end }}
          {{- if ne .Values.config.logLevel "info" }}
        - --log-level=default={{ .Values.config.logLevel }}
          {{- end }}
        {{- else }}
        - --log-level={{ .Values.config.logLevel }}
        {{- end }}
        - --watcher-config=/etc/watcher/watcher.yaml
        - --max-concurrent-requests={{ .Values.config.maxConcurrentRequests }}
        - --data-dir={{ .Values.embedded.dataDir }}
        - --embedded-flush-interval={{ .Values.embedded.flushInterval }}
        - --embedded-retention-days={{ .Values.embedded.retentionDays }}
        {{- if .Values.embedded.checkpointInterval }}
        - --embedded-checkpoint-interval={{ .Values.embedded.checkpointInterval }}
        {{- end }}
        - --embedded-checkpoint-retention-count={{ .Values.embedded.checkpointRetentionCount }}
        {{- if .Values.embedded.checkpointMaxTailEvents }}
        - --embedded-checkpoint-max-tail-events={{ .Values.embedded.checkpointMaxTailEvents }}
        {{- end }}
        {{- if .Values.embedded.checkpointMaxTailBytes }}
        - --embedded-checkpoint-max-tail-bytes={{ int64 .Values.embedded.checkpointMaxTailBytes }}
        {{- end }}
        - --embedded-checkpoint-on-shutdown={{ .Values.embedded.checkpointOnShutdown }}
        - --embedded-segment-target-bytes={{ int64 .Values.embedded.segmentTargetBytes }}
        - --embedded-compaction-min-segments={{ .Values.embedded.compactionMinSegments }}
        - --embedded-auto-compaction={{ .Values.embedded.autoCompaction }}
        {{- if .Values.pprof.enabled }}
        - --pprof-enabled=true
        - --pprof-port={{ .Values.pprof.port }}
        {{- end }}
        {{- if .Values.tracing.enabled }}
        - --tracing-enabled=true
        - --tracing-endpoint={{ .Values.tracing.endpoint }}
        {{- end }}
        {{- if .Values.metadataCache }}
        - --metadata-cache-refresh-seconds={{ .Values.metadataCache.refreshSeconds }}
        {{- end }}
        {{- range .Values.extraArgs }}
        - {{ . }}
        {{- end }}
        volumeMounts:
        - name: watcher-config
          mountPath: /etc/watcher
          readOnly: true
        - name: embedded-data
          mountPath: {{ .Values.embedded.dataDir }}
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.envFrom }}
        envFrom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 10 }}
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 10 }}
        {{- end }}
        {{- if .Values.startupProbe.enabled }}
        startupProbe:
          {{- omit .Values.startupProbe "enabled" | toYaml | nindent 10 }}
        {{- end }}
        {{- with .Values.lifecycle }}
        lifecycle:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: watcher-config
        configMap:
          name: {{ include "spectre.fullname" . }}
      - name: embedded-data
        {{- if .Values.embedded.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ default (printf "%s-embedded" (include "spectre.fullname" .)) .Values.embedded.persistence.existingClaim }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
