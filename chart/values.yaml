nameOverride: ""
fullnameOverride: ""
namespace: monitoring

image:
  repository: ghcr.io/moolen/spectre
  tag: test-build
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

minReadySeconds: 0

revisionHistoryLimit: 5

resources:
  requests:
    memory: "500Mi"
    cpu: "500m"
  limits:
    memory: "1400Mi"

# Service configuration
# Port allocation:
#   - 8080: HTTP REST API with gRPC-Web support, MCP at /v1/mcp (main service)
#   - 9999: pprof profiling endpoint
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}
  labels: {}
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""
  sessionAffinity: None
  sessionAffinityConfig: {}

# Pprof profiling configuration
pprof:
  enabled: false
  port: 9999

# OpenTelemetry tracing configuration
tracing:
  enabled: false
  endpoint: ""  # OTLP gRPC endpoint (e.g., "victorialogs:4317")

embedded:
  dataDir: /var/lib/spectre-data
  flushInterval: 30s
  retentionDays: 0
  checkpointInterval: 15m
  checkpointRetentionCount: 3
  checkpointMaxTailEvents: 2048
  checkpointMaxTailBytes: 16777216
  checkpointOnShutdown: true
  segmentTargetBytes: 16777216
  compactionMinSegments: 4
  autoCompaction: true
  persistence:
    enabled: false
    size: 10Gi
    # storageClassName: ""  # Use default storage class if not specified
    accessModes:
      - ReadWriteOnce
    annotations: {}
    selector: {}
    existingClaim: ""

# Metadata cache configuration
metadataCache:
  # How often to refresh the metadata cache (in seconds)
  # Lower values mean more up-to-date metadata but more database queries
  # Higher values reduce database load but may show stale data
  refreshSeconds: 30

config:
  logLevel: "info"
  # Per-package log level overrides
  # Supports exact package names and wildcard patterns (*.suffix)
  # Examples:
  #   watcher: "debug"         # Exact match for watcher package
  #   embedded.*: "debug"      # Wildcard pattern for embedded packages
  #   controller: "warn"       # Only warn and above for controller
  # If a package matches multiple patterns, the most specific pattern wins
  # Packages not listed use the default logLevel above
  logLevels: {}
    # watcher: "debug"
    # embedded.*: "debug"
    # controller: "warn"
  maxConcurrentRequests: 100
  # Watcher configuration - resources to watch
  # Each resource specifies Group/Version/Kind and optional namespace
  watcher:
    resources:
      - group: ""
        version: "v1"
        kind: "Pod"
      - group: "apps"
        version: "v1"
        kind: "ReplicaSet"
      - group: "apps"
        version: "v1"
        kind: "Deployment"
      - group: ""
        version: "v1"
        kind: "Service"
      - group: ""
        version: "v1"
        kind: "Node"
      - group: "apps"
        version: "v1"
        kind: "StatefulSet"
      - group: "apps"
        version: "v1"
        kind: "DaemonSet"
      - group: ""
        version: "v1"
        kind: "ConfigMap"
      - group: "networking.k8s.io"
        version: "v1"
        kind: "NetworkPolicy"
      - group: "networking.k8s.io"
        version: "v1"
        kind: "Ingress"
      - group: "helm.toolkit.fluxcd.io"
        version: "v2"
        kind: "HelmRelease"
      - group: "kustomize.toolkit.fluxcd.io"
        version: "v1"
        kind: "Kustomization"
      - group: "source.toolkit.fluxcd.io"
        version: "v1"
        kind: "HelmRepository"
      - group: "source.toolkit.fluxcd.io"
        version: "v1"
        kind: "GitRepository"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60
  successThreshold: 1

podAnnotations: {}
podLabels: {}
priorityClassName: ""
terminationGracePeriodSeconds: 60
dnsPolicy: ClusterFirst
dnsConfig: {}
hostAliases: []
hostNetwork: false
hostPID: false
hostIPC: false
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

serviceAccount:
  create: true
  name: ""  # Will use "spectre" if not specified
  annotations: {}
  automountServiceAccountToken: true

extraArgs: []

extraVolumes: []
extraVolumeMounts: []

env: []
envFrom: []
lifecycle: {}
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: spectre.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  mcp:
    enabled: false
    host: mcp.spectre.example.com
    paths:
      - path: /
        pathType: Prefix
    tls: []

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  relabelings: []
  metricRelabelings: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1
